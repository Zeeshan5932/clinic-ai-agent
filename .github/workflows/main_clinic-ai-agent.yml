name: Build and deploy FastAPI backend to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Isko Azure App Service ke exact Name se match karein.
  AZURE_WEBAPP_NAME: "clinic-ai-agent"

  # Repository mein sirf backend folder deploy hoga.
  AZURE_WEBAPP_PACKAGE_PATH: "backend"

  PYTHON_VERSION: "3.11"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install and verify backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E5C7CE6087A749CA99F4FEE70A4F9220 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B814BC544ACF4AABB585C9D09BD4F383 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F832F74C7E7442A0836F6EE8360CB118 }}

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: "Production"
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
